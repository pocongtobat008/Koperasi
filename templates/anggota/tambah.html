{% extends "base.html" %}
{% block title %}Tambah Anggota{% endblock %}
{% block content %}

<div class="page-header">
  <div>
    <div class="page-header-title">Tambah Anggota</div>
    <div class="page-header-sub">Daftarkan anggota baru koperasi</div>
  </div>
  <a class="btn btn-secondary" href="{{ url_for('anggota.index') }}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M15 18l-6-6 6-6"/></svg>
    Kembali
  </a>
</div>

<!-- Flat illustration header -->
<div class="card" style="padding:var(--spacing-lg) 24px;margin-bottom:var(--spacing-md);display:flex;align-items:center;gap:16px">
  <svg viewBox="0 0 64 64" width="48" height="48" aria-hidden="true">
    <rect x="8" y="16" width="48" height="40" rx="8" fill="#F59E0B"/>
    <rect x="8" y="16" width="48" height="12" rx="6" fill="#FBBF24"/>
    <circle cx="20" cy="40" r="4" fill="#0F172A"/>
    <circle cx="44" cy="40" r="4" fill="#0F172A"/>
  </svg>
  <div>
    <div style="font-weight:700;font-size:16px">Formulir Pendaftaran</div>
    <div style="font-size:13px;color:var(--muted)">Isi data anggota baru sesuai KTP</div>
  </div>
</div>

<div class="card" style="max-width:720px;padding:28px 24px">
  <form method="post" class="form-grid form-grid-2">
    <div>
      <label class="label" for="nama">Nama Lengkap <span style="color:var(--primary-darker)">*</span></label>
      <input id="nama" name="nama" type="text" class="field" required placeholder="Nama sesuai KTP">
    </div>
    <div>
      <label class="label" for="nik">NIK <span style="color:var(--primary-darker)">*</span></label>
      <input id="nik" name="nik" type="text" class="field" required maxlength="16" placeholder="16 digit NIK">
    </div>
    <div>
      <label class="label" for="telepon">Nomor Telepon</label>
      <input id="telepon" name="telepon" type="tel" class="field" placeholder="08xx-xxxx-xxxx">
    </div>
    <div>
      <label class="label" for="status">Status</label>
      <select id="status" name="status" class="field">
        <option value="aktif">Aktif</option>
        <option value="nonaktif">Non-aktif</option>
      </select>
    </div>
    <div style="grid-column:1/-1">
      <label class="label" for="alamat">Alamat</label>
      <textarea id="alamat" name="alamat" class="field" placeholder="Alamat lengkap"></textarea>
    </div>
    <div style="grid-column:1/-1;display:flex;gap:12px;padding-top:8px">
      <button class="btn btn-primary" type="submit">Simpan Anggota</button>
      <a class="btn btn-secondary" href="{{ url_for('anggota.index') }}">Batal</a>
    </div>
  </form>
</div>

{% endblock %}
